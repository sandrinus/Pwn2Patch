<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pwn2Patch</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --code-bg: #fbfbfc;
    --border: #e2e5ea; --text: #15181d; --muted: #5f6875; --faint: #9aa2ad;
    --accent: #3b5bdb; --accent-text: #ffffff;
    --critical: #d9282f; --high: #e8590c; --medium: #d48a00; --low: #1971c2; --info: #7a838e;
    --pass: #2b8a3e; --fail: #d9282f;
    --good: #2b8a3e; --warn: #d48a00; --bad: #d9282f;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a20; --panel-2: #1f232b; --code-bg: #13161b;
      --border: #2a2f39; --text: #e6e8ec; --muted: #9aa3af; --faint: #5d6570;
      --accent: #748ffc; --accent-text: #0f1115;
      --critical: #ff6b6b; --high: #ff922b; --medium: #fcc419; --low: #4dabf7; --info: #adb5bd;
      --pass: #51cf66; --fail: #ff6b6b; --good: #51cf66; --warn: #fcc419; --bad: #ff6b6b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a20; --panel-2: #1f232b; --code-bg: #13161b;
    --border: #2a2f39; --text: #e6e8ec; --muted: #9aa3af; --faint: #5d6570;
    --accent: #748ffc; --accent-text: #0f1115;
    --critical: #ff6b6b; --high: #ff922b; --medium: #fcc419; --low: #4dabf7; --info: #adb5bd;
    --pass: #51cf66; --fail: #ff6b6b; --good: #51cf66; --warn: #fcc419; --bad: #ff6b6b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
  code { font-family: var(--mono); font-size: 0.92em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); }

  .sev-critical { --sev-color: var(--critical); }
  .sev-high { --sev-color: var(--high); }
  .sev-medium { --sev-color: var(--medium); }
  .sev-low { --sev-color: var(--low); }
  .sev-info { --sev-color: var(--info); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; flex: none; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .spacer { flex: 1; }
  .ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .ghost:hover { background: var(--panel-2); }

  /* ---------- layout ---------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
  .primary:disabled { opacity: 0.6; cursor: progress; }
  .primary kbd { font: 11px var(--mono); opacity: 0.75; }

  /* ---------- editor ---------- */
  .editor { flex: 1; min-height: 0; display: flex; background: var(--code-bg); font: 13px/20px var(--mono); }
  .editor:focus-within { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .gutter { width: 54px; flex: none; overflow: hidden; border-right: 1px solid var(--border); color: var(--faint); text-align: right; user-select: none; }
  #gutter-inner { padding: 12px 10px 60px 0; will-change: transform; }
  .ln { height: 20px; position: relative; }
  .ln.mark { color: var(--sev-color); font-weight: 700; cursor: pointer; }
  .ln.mark::before { content: ""; position: absolute; left: 9px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--sev-color); }
  .ln.active { color: var(--accent); }
  .code-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  .bands { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #bands { position: relative; will-change: transform; }
  .band { position: absolute; left: 0; right: 0; height: 20px; background: color-mix(in srgb, var(--sev-color) 12%, transparent); border-left: 3px solid var(--sev-color); }
  .band.active { background: color-mix(in srgb, var(--accent) 20%, transparent); border-left-color: var(--accent); }
  textarea#code { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: inherit; padding: 12px 16px; white-space: pre; overflow: auto; tab-size: 4; }

  /* ---------- results ---------- */
  .results-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .results-head h2 { font-size: 14px; margin: 0; }
  .results-body { flex: 1; overflow: auto; padding: 16px; }
  .empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .stale-banner { display: none; margin: 0 0 14px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); font-size: 13px; }
  .is-stale .stale-banner { display: block; }
  .is-stale .report { opacity: 0.55; }

  .summary { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .track { stroke: var(--panel-2); }
  .ring .value { stroke: var(--ring-color); stroke-linecap: round; transition: stroke-dasharray 0.8s cubic-bezier(.2,.8,.2,1); }
  .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-label strong { font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
  .ring-label span { font-size: 12px; color: var(--muted); }
  .verdict { flex: 1; min-width: 200px; }
  .grade-line { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .grade { font-size: 26px; font-weight: 800; color: var(--ring-color); line-height: 1; }
  .gate { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12.5px; letter-spacing: 0.04em; }
  .gate.PASS { background: color-mix(in srgb, var(--pass) 15%, transparent); color: var(--pass); }
  .gate.FAIL { background: color-mix(in srgb, var(--fail) 15%, transparent); color: var(--fail); }
  .reasons { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .stats { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  .section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
  .cats { display: grid; gap: 4px; }
  .cat { display: grid; grid-template-columns: 120px 1fr 34px 70px; gap: 10px; align-items: center; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; text-align: left; }
  .cat:hover { background: var(--panel-2); }
  .cat.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .cat-name { font-weight: 600; text-transform: capitalize; }
  .bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--bar-color); width: 0; transition: width 0.8s cubic-bezier(.2,.8,.2,1); }
  .cat-score { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .cat-count { color: var(--muted); font-size: 12.5px; text-align: right; }

  .cwe-note { color: var(--muted); font-size: 12.5px; margin: -2px 0 8px; }
  .cwe-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .cwe-row { display: grid; grid-template-columns: 8px 78px minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; background: none; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; text-align: left; }
  .cwe-row:hover { background: var(--panel-2); }
  .cwe-row.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .cwe-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-color); }
  .cwe-id { font: 600 12.5px var(--mono); }
  .cwe-short { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cwe-count { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .quality-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .cwe-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .cwe-pill { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; text-decoration: none; color: var(--text); border: 1px solid color-mix(in srgb, var(--sev-color) 45%, var(--border)); border-radius: 999px; padding: 1px 9px; }
  .cwe-pill b { font: 600 11.5px var(--mono); color: var(--sev-color); }
  .cwe-pill.quality { border-color: var(--border); }
  .cwe-pill.quality b { color: var(--muted); }
  .cwe-pill:hover { background: var(--panel-2); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-color, var(--muted)); }
  .chip.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .chip b { font-variant-numeric: tabular-nums; }

  .findings { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .finding { min-width: 0; border: 1px solid var(--border); border-left: 4px solid var(--sev-color); border-radius: 8px; background: var(--panel); transition: box-shadow 0.2s, border-color 0.2s; }
  .finding.is-active { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
  .finding-head { width: 100%; display: flex; gap: 10px; align-items: baseline; background: none; border: 0; padding: 10px 12px 2px; text-align: left; }
  .sev { font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--sev-color); text-transform: uppercase; flex: none; width: 62px; }
  .finding-title { font-weight: 600; flex: 1; }
  .loc { font: 12px var(--mono); color: var(--muted); flex: none; }
  .finding-head:hover .loc { color: var(--accent); }
  .finding-body { padding: 0 12px 10px 84px; }
  .msg { margin: 2px 0 6px; color: var(--muted); overflow-wrap: anywhere; }
  .snippet { display: block; font: 12px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--border); padding: 6px 8px; border-radius: 6px; white-space: pre; overflow-x: auto; margin-bottom: 6px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details p { margin: 6px 0; font-size: 13px; }
  .rule-id { font: 11.5px var(--mono); color: var(--faint); margin-left: 6px; }
  .none { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; }
  .error-card { border: 1px solid color-mix(in srgb, var(--fail) 40%, transparent); background: color-mix(in srgb, var(--fail) 8%, transparent); border-radius: 8px; padding: 14px; }

  /* ---------- rules dialog ---------- */
  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
  dialog::backdrop { background: rgb(0 0 0 / 0.45); }
  .dialog-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  .dialog-head h2 { margin: 0; font-size: 16px; flex: 1; }
  .dialog-body { padding: 14px 18px 20px; overflow: auto; }
  .policy-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .fact { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .fact b { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.sev-cell { color: var(--sev-color); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ---------- Pwn2Patch additions ---------- */
  header h1 .two { color: var(--accent); }
  .icon-btn { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); margin: 0; }

  /* editor: column underlines, overview ruler, hover card */
  .squiggles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #squiggles { position: relative; will-change: transform; }
  .squiggle { position: absolute; height: 2px; background: repeating-linear-gradient(90deg, var(--sev-color) 0 4px, transparent 4px 6px); border-radius: 1px; }
  .ruler { width: 12px; flex: none; position: relative; border-left: 1px solid var(--border); background: var(--panel); }
  .tick { position: absolute; left: 2px; right: 2px; height: 4px; min-height: 3px; border-radius: 2px; background: var(--sev-color); cursor: pointer; padding: 0; border: 0; }
  .tick:hover { left: 0; right: 0; }
  .hovercard { position: fixed; z-index: 20; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); padding: 6px; font-size: 13px; display: none; }
  .hovercard.show { display: block; }
  .hc-item { padding: 6px 8px; border-left: 3px solid var(--sev-color); border-radius: 4px; }
  .hc-item + .hc-item { margin-top: 4px; }
  .hc-item .sev { width: auto; margin-right: 6px; }
  .hc-item p { margin: 2px 0 4px; color: var(--muted); }

  /* score change between runs */
  .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .delta.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .delta.same { color: var(--muted); background: var(--panel-2); }
  .delta-detail { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  @keyframes celebrate { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .celebrate .ring, .celebrate .gate { animation: celebrate 0.7s ease 2; }

  /* findings: points and fixes */
  .pts { font: 600 11.5px var(--mono); color: var(--bad); flex: none; font-variant-numeric: tabular-nums; }
  .pts.uncounted { color: var(--faint); font-weight: 400; }
  .finding-actions { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .fix-btn { border: 1px solid color-mix(in srgb, var(--good) 50%, var(--border)); color: var(--good); background: color-mix(in srgb, var(--good) 8%, transparent); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
  .fix-btn:hover { background: color-mix(in srgb, var(--good) 16%, transparent); }
  .manual { font-size: 12px; color: var(--faint); }
  .patch-all { background: var(--good); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
  :root[data-theme="dark"] .patch-all { color: #0f1115; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .patch-all { color: #0f1115; } }
  .patch-all:disabled { opacity: 0.6; cursor: progress; }

  /* diff dialog */
  .diff { font: 12.5px/1.55 var(--mono); border: 1px solid var(--border); border-radius: 8px; overflow: auto; background: var(--code-bg); max-height: 55vh; }
  .diff div { white-space: pre; padding: 0 10px 0 0; min-width: max-content; }
  .diff .ln-no { display: inline-block; width: 42px; padding-right: 8px; text-align: right; color: var(--faint); user-select: none; }
  .diff .add { background: color-mix(in srgb, var(--good) 14%, transparent); }
  .diff .del { background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .diff .hunk { color: var(--muted); background: var(--panel-2); padding: 2px 10px; }
  .dialog-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
  .dialog-foot .meta { flex: 1; }
  .fix-note { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; }
  .applied-list { columns: 2; margin: 0 0 12px; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
  .score-preview { font-size: 15px; margin: 0 0 10px; }
  .score-preview b { font-variant-numeric: tabular-nums; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 600; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 30; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; padding: 12px 16px 16px; }
    .editor-panel { height: 60vh; min-height: 360px; }
    .results-panel { min-height: 50vh; }
    .cat { grid-template-columns: 100px 1fr 30px; }
    .cat-count { display: none; }
    .cwe-row { grid-template-columns: 8px 70px minmax(0, 1fr) auto 30px; gap: 8px; }
    .finding-body { padding-left: 12px; }
    .gutter { width: 44px; }
    header .sub { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="M9 12h6M12 9v6"/></svg>
  </div>
  <div>
    <h1>Pwn<span class="two">2</span>Patch</h1>
    <div class="sub">Find the vulnerabilities in your Python, patch them, and watch the score climb · code is parsed, never run</div>
  </div>
  <div class="spacer"></div>
  <button class="ghost icon-btn" id="theme-btn" title="Switch light / dark theme" aria-label="Switch theme">◐</button>
  <button class="ghost" id="rules-btn">View policy</button>
</header>

<main>
  <section class="panel editor-panel" aria-label="Code editor">
    <div class="toolbar">
      <button class="ghost" data-sample="bad_example">Messy sample</button>
      <button class="ghost" data-sample="good_example">Clean sample</button>
      <button class="ghost" id="open-btn">Open file…</button>
      <input type="file" id="file-input" accept=".py,.txt" hidden>
      <button class="ghost" id="undo-btn" hidden title="Undo the last patch">↶ Undo</button>
      <div class="spacer"></div>
      <span class="meta" id="line-meta">0 lines</span>
      <label class="toggle" title="Re-analyze automatically as you type"><input type="checkbox" id="live-toggle" checked> Live</label>
      <button class="primary" id="analyze-btn">Analyze <kbd id="analyze-kbd">Ctrl ↵</kbd></button>
    </div>
    <div class="editor">
      <div class="gutter" aria-hidden="true"><div id="gutter-inner"></div></div>
      <div class="code-wrap">
        <div class="bands" aria-hidden="true"><div id="bands"></div></div>
        <div class="squiggles" aria-hidden="true"><div id="squiggles"></div></div>
        <textarea id="code" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off"
                  aria-label="Python code to analyze" placeholder="Paste Python code here…"></textarea>
      </div>
      <div class="ruler" id="ruler" title="Overview: click a mark to jump to it"></div>
    </div>
  </section>

  <section class="panel results-panel" id="results-panel" aria-label="Analysis results">
    <div class="results-head">
      <h2>Report</h2>
      <div class="spacer" style="flex:1"></div>
      <button class="patch-all" id="patch-all-btn" hidden>Patch all</button>
      <button class="ghost" id="export-btn" hidden>Export JSON</button>
    </div>
    <div class="results-body" id="results" aria-live="polite"></div>
  </section>
</main>

<dialog id="rules-dialog">
  <div class="dialog-head">
    <h2 id="policy-title">Policy</h2>
    <button class="ghost" id="close-rules">Close</button>
  </div>
  <div class="dialog-body" id="rules-body">Loading…</div>
</dialog>

<dialog id="diff-dialog">
  <div class="dialog-head">
    <h2 id="diff-title">Preview fix</h2>
    <button class="ghost" id="close-diff">Close</button>
  </div>
  <div class="dialog-body" id="diff-body"></div>
  <div class="dialog-foot">
    <span class="meta" id="diff-meta"></span>
    <button class="ghost" id="cancel-diff">Cancel</button>
    <button class="primary" id="apply-diff">Apply patch</button>
  </div>
</dialog>

<div class="hovercard" id="hovercard" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const LINE_H = 20, PAD = 12;
  const SEVERITIES = ["critical", "high", "medium", "low", "info"];
  const $ = (sel, el = document) => el.querySelector(sel);

  const codeEl = $("#code"), gutterInner = $("#gutter-inner"), bandsEl = $("#bands");
  const squigglesEl = $("#squiggles"), ruler = $("#ruler"), hovercard = $("#hovercard");
  const patchAllBtn = $("#patch-all-btn"), undoBtn = $("#undo-btn"), liveToggle = $("#live-toggle");
  const resultsEl = $("#results"), resultsPanel = $("#results-panel");
  const analyzeBtn = $("#analyze-btn"), exportBtn = $("#export-btn"), lineMeta = $("#line-meta");

  let samples = {};
  let report = null;          // last report from the server
  let analyzedCode = null;    // the code that report describes
  let previous = null;        // the report before that, for the "score went up" badge
  let reportVersion = 0;
  let newFile = false;
  let activeLine = null;
  let requestSeq = 0;         // ignore responses that arrive after a newer request
  let liveTimer = null;
  const undoStack = [];
  const filters = { category: null, severity: null, cwe: null, fixable: false };
  const isMac = /Mac|iPhone|iPad/.test(navigator.userAgentData?.platform || navigator.platform || "");
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode */ } },
  };
  const QUALITY_HINT = "MITRE classifies this as a code-quality weakness: it describes the problem, " +
                       "but MITRE says not to use it to label security vulnerabilities.";

  // ------------------------------------------------------------ helpers
  const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const richText = s => escapeHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const isFresh = () => report && codeEl.value === analyzedCode;
  const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
  const gradeColor = score => score >= 90 ? "var(--good)" : score >= 70 ? "var(--warn)" : "var(--bad)";

  function refLink(ref) {
    if (!ref) return "";
    const cwe = ref.match(/^CWE-(\d+)$/), pep = ref.match(/^PEP (\d+)$/);
    let url = null, label = ref;
    if (cwe) url = `https://cwe.mitre.org/data/definitions/${cwe[1]}.html`;
    else if (pep) url = `https://peps.python.org/pep-${pep[1].padStart(4, "0")}/`;
    else if (/^https?:\/\//.test(ref)) { url = ref; label = "Reference"; }
    return url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)} ↗</a>` : escapeHtml(ref);
  }

  // Worst severity per line, used for gutter dots and line bands.
  function lineMarks() {
    const marks = new Map();
    if (!isFresh()) return marks;
    if (!report.ok) {
      if (report.error?.line) marks.set(report.error.line, "critical");
      return marks;
    }
    for (const f of report.findings) {
      const prev = marks.get(f.line);
      if (!prev || SEVERITIES.indexOf(f.severity) < SEVERITIES.indexOf(prev)) marks.set(f.line, f.severity);
    }
    return marks;
  }

  function findingsOnLine(line) {
    return isFresh() && report.ok ? report.findings.filter(f => f.line === line) : [];
  }

  // Width of one monospace character, for placing column underlines.
  let charW = 0;
  function measureChar() {
    const probe = Object.assign(document.createElement("span"), { textContent: "x".repeat(100) });
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:13px/20px var(--mono)";
    codeEl.parentElement.appendChild(probe);
    charW = probe.getBoundingClientRect().width / 100;
    probe.remove();
  }

  // The analyzer reports UTF-8 byte columns; convert to a character index.
  const utf8 = new TextEncoder();
  function charIndex(text, byteCol) {
    let bytes = 0, i = 0;
    for (const ch of text) {
      if (bytes >= byteCol) break;
      bytes += utf8.encode(ch).length;
      i += ch.length;
    }
    return i;
  }

  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  // ------------------------------------------------------------ editor
  let gutterKey = "";
  function renderEditorDecorations(force = false) {
    const count = codeEl.value.split("\n").length;
    lineMeta.textContent = `${count} line${count === 1 ? "" : "s"}`;
    const marks = lineMarks();
    const key = `${count}|${isFresh()}|${activeLine}|${reportVersion}`;
    if (key !== gutterKey || force) {
      gutterKey = key;
      let html = "";
      for (let i = 1; i <= count; i++) {
        const sev = marks.get(i);
        const cls = ["ln", sev ? `mark sev-${sev}` : "", i === activeLine ? "active" : ""].join(" ");
        html += `<div class="${cls}" data-line="${i}">${i}</div>`;
      }
      gutterInner.innerHTML = html;

      let bands = "";
      for (const [line, sev] of marks) bands += `<div class="band sev-${sev}" style="top:${PAD + (line - 1) * LINE_H}px"></div>`;
      if (activeLine) bands += `<div class="band active" style="top:${PAD + (activeLine - 1) * LINE_H}px"></div>`;
      bandsEl.innerHTML = bands;

      // Underline from the reported column to the end of the line's code.
      let squiggles = "";
      if (isFresh() && report.ok && charW) {
        const lines = codeEl.value.split("\n");
        for (const f of report.findings) {
          const text = lines[f.line - 1] ?? "";
          const start = Math.min(charIndex(text, Math.max(0, (f.col || 1) - 1)), text.length);
          const firstCode = text.length - text.trimStart().length;
          const from = Math.max(start, firstCode);
          const width = Math.max(1, text.trimEnd().length - from);
          squiggles += `<div class="squiggle sev-${f.severity}" style="top:${PAD + f.line * LINE_H - 3}px;` +
                       `left:${16 + from * charW}px;width:${width * charW}px"></div>`;
        }
      }
      squigglesEl.innerHTML = squiggles;

      // Overview ruler: one tick per marked line, positioned by its share of the file.
      ruler.innerHTML = [...marks].map(([line, sev]) =>
        `<button class="tick sev-${sev}" data-line="${line}" title="Line ${line}" style="top:calc(${((line - 1) / Math.max(count, 1)) * 100}% + 2px)"></button>`).join("");
    }
    syncScroll();
  }

  function syncScroll() {
    const y = -codeEl.scrollTop;
    gutterInner.style.transform = `translateY(${y}px)`;
    bandsEl.style.transform = `translateY(${y}px)`;
    squigglesEl.style.transform = `translate(${-codeEl.scrollLeft}px, ${y}px)`;
  }

  function jumpToLine(line) {
    const lines = codeEl.value.split("\n");
    let offset = 0;
    for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
    activeLine = line;
    codeEl.focus({ preventScroll: true });
    codeEl.setSelectionRange(offset, offset);
    codeEl.scrollTop = Math.max(0, PAD + (line - 1) * LINE_H - codeEl.clientHeight / 3);
    codeEl.scrollLeft = 0;
    renderEditorDecorations();
    markActiveFindings(line, false);
  }

  // keepHistory: a patch or undo of the same file, so the score badge and undo stack stay meaningful.
  function setCode(text, { keepHistory = false } = {}) {
    if (!keepHistory) {
      previous = null;
      undoStack.length = 0;
      undoBtn.hidden = true;
      newFile = true;   // don't compare the next report with a different file's
    }
    codeEl.value = text.replace(/\r\n/g, "\n");
    codeEl.scrollTop = 0;
    activeLine = null;
    onCodeChanged();
  }

  function onCodeChanged() {
    resultsPanel.classList.toggle("is-stale", !!report && !isFresh());
    renderEditorDecorations();
    hideHovercard();
    clearTimeout(liveTimer);
    if (liveToggle.checked && codeEl.value.trim() && !isFresh()) liveTimer = setTimeout(() => runAnalysis({ quiet: true }), 450);
  }

  codeEl.addEventListener("input", onCodeChanged);
  codeEl.addEventListener("scroll", () => { syncScroll(); hideHovercard(); });
  liveToggle.checked = storage.get("p2p-live") !== "off";
  liveToggle.addEventListener("change", () => {
    storage.set("p2p-live", liveToggle.checked ? "on" : "off");
    if (liveToggle.checked && !isFresh()) runAnalysis({ quiet: true });
  });

  // ---- hover card: what's wrong on the line under the mouse
  let hoverLine = null, hideTimer = null;
  function hideHovercard() { hovercard.classList.remove("show"); hoverLine = null; }
  codeEl.addEventListener("mousemove", e => {
    const rect = codeEl.getBoundingClientRect();
    const line = Math.floor((e.clientY - rect.top + codeEl.scrollTop - PAD) / LINE_H) + 1;
    const found = findingsOnLine(line);
    if (!found.length) { if (!hovercard.matches(":hover")) { clearTimeout(hideTimer); hideTimer = setTimeout(hideHovercard, 150); } return; }
    clearTimeout(hideTimer);
    if (line !== hoverLine) {
      hoverLine = line;
      hovercard.innerHTML = found.map(f => `
        <div class="hc-item sev-${f.severity}">
          <span class="sev">${f.severity}</span><b>${escapeHtml(f.title)}</b>
          <p>${richText(f.message)}</p>
          ${f.fix ? `<button class="fix-btn" data-fix="${report.findings.indexOf(f)}">Preview fix</button>`
                  : `<span class="manual">No auto-patch: see the report</span>`}
        </div>`).join("");
      hovercard.classList.add("show");
    }
    const top = rect.top + PAD + line * LINE_H - codeEl.scrollTop + 4;
    const below = top + hovercard.offsetHeight < innerHeight - 8;
    hovercard.style.top = `${below ? top : top - LINE_H - hovercard.offsetHeight - 8}px`;
    hovercard.style.left = `${Math.min(e.clientX + 12, innerWidth - hovercard.offsetWidth - 12)}px`;
  });
  codeEl.addEventListener("mouseleave", () => { hideTimer = setTimeout(() => { if (!hovercard.matches(":hover")) hideHovercard(); }, 200); });
  hovercard.addEventListener("mouseleave", hideHovercard);
  hovercard.addEventListener("click", e => {
    const btn = e.target.closest("[data-fix]");
    if (btn) { hideHovercard(); previewFix(report.findings[Number(btn.dataset.fix)]); }
  });

  ruler.addEventListener("click", e => {
    const tick = e.target.closest(".tick");
    if (!tick) return;
    jumpToLine(Number(tick.dataset.line));
    markActiveFindings(Number(tick.dataset.line), true);
  });
  codeEl.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const { selectionStart: s, selectionEnd: end } = codeEl;
      codeEl.setRangeText("    ", s, end, "end");
      onCodeChanged();
    } else if (e.key === "Escape") {
      codeEl.blur();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runAnalysis(); }
  });
  gutterInner.addEventListener("click", e => {
    const ln = e.target.closest(".ln.mark");
    if (!ln) return;
    const line = Number(ln.dataset.line);
    jumpToLine(line);
    markActiveFindings(line, true);
  });

  // ------------------------------------------------------------ analysis
  async function postJson(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  // quiet: a live re-run while typing; it shouldn't move the cursor or flash the button.
  async function runAnalysis({ quiet = false } = {}) {
    clearTimeout(liveTimer);
    const code = codeEl.value;
    const seq = ++requestSeq;
    if (!quiet) { analyzeBtn.disabled = true; analyzeBtn.firstChild.textContent = "Analyzing… "; }
    try {
      const data = await postJson("/api/analyze", { code });
      if (seq !== requestSeq) return null;           // a newer run is on its way
      if (newFile) { previous = null; newFile = false; }
      else if (report?.ok && analyzedCode !== code) previous = { report, code: analyzedCode };
      report = data;
      analyzedCode = code;
      reportVersion++;
      if (!quiet) activeLine = null;
      renderResults();
      renderEditorDecorations(true);
      resultsPanel.classList.remove("is-stale");
      if (!quiet && !data.ok && data.error?.line) jumpToLine(data.error.line);
      return data;
    } catch (err) {
      if (seq !== requestSeq) return null;
      resultsEl.innerHTML = `<div class="error-card"><strong>Request failed.</strong> ${escapeHtml(err.message)}<br>
        Is <code>python server.py</code> still running?</div>`;
      return null;
    } finally {
      if (seq === requestSeq) { analyzeBtn.disabled = false; analyzeBtn.firstChild.textContent = "Analyze "; }
    }
  }
  analyzeBtn.addEventListener("click", () => runAnalysis());
  $("#analyze-kbd").textContent = isMac ? "⌘ ↵" : "Ctrl ↵";

  // What changed since the previous run: score delta plus fixed / new findings.
  function changeSummary() {
    if (!previous || !report?.ok) return null;
    // Compare counts per rule: a finding whose line text changed (say, after a rename) is not "new".
    const counts = list => list.reduce((m, f) => m.set(f.rule_id, (m.get(f.rule_id) || 0) + 1), new Map());
    const before = counts(previous.report.findings), after = counts(report.findings);
    let fixed = 0, added = 0;
    for (const rule of new Set([...before.keys(), ...after.keys()])) {
      const d = (after.get(rule) || 0) - (before.get(rule) || 0);
      if (d > 0) added += d; else fixed -= d;
    }
    return { delta: report.score - previous.report.score, from: previous.report.score, fixed, added,
             gateFlipped: previous.report.gate.status === "FAIL" && report.gate.status === "PASS" };
  }

  // ------------------------------------------------------------ results
  function renderEmpty() {
    exportBtn.hidden = patchAllBtn.hidden = true;
    resultsEl.innerHTML = `<div class="empty"><div>
      <strong>No report yet</strong>
      Paste Python code or load a sample, then press <b>Analyze</b>.<br>
      The code is parsed, never executed.
    </div></div>`;
  }

  function renderDelta() {
    const c = changeSummary();
    if (!c) return "";
    const cls = c.delta > 0 ? "up" : c.delta < 0 ? "down" : "same";
    const arrow = c.delta > 0 ? "▲" : c.delta < 0 ? "▼" : "•";
    const parts = [c.fixed && `${c.fixed} fixed`, c.added && `${c.added} new`].filter(Boolean).join(" · ");
    return `<div class="delta-detail"><span class="delta ${cls}">${arrow} ${c.delta > 0 ? "+" : ""}${c.delta}</span>
      from ${c.from}${parts ? ` · ${parts}` : ""}</div>`;
  }

  function renderResults() {
    if (!report) return renderEmpty();
    exportBtn.hidden = false;
    patchAllBtn.hidden = !report.ok || !report.fixable;
    if (report.ok) patchAllBtn.textContent = `Patch all (${report.fixable})`;
    const stale = `<div class="stale-banner">The code changed since this report. Press <b>Analyze</b> to update it.</div>`;

    if (!report.ok) {
      const e = report.error;
      resultsEl.innerHTML = stale + `<div class="report"><div class="error-card">
        <span class="gate FAIL">FAIL</span>
        <p><strong>${escapeHtml(e.message)}</strong>${e.line ? ` on line ${e.line}` : ""}.</p>
        <p class="meta">The code has to parse before it can be checked against the policy.</p>
        ${e.line ? `<button class="ghost" data-goto="${e.line}">Go to line ${e.line}</button>` : ""}
      </div></div>`;
      return;
    }

    const r = report;
    const s = r.stats;
    const color = gradeColor(r.score);
    const reasons = r.gate.reasons.length
      ? `<ul class="reasons">${r.gate.reasons.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`
      : `<p class="reasons" style="padding:0">Meets every requirement of the policy.</p>`;

    const cats = Object.entries(r.categories).map(([name, c]) => `
      <button class="cat ${filters.category === name ? "active" : ""}" data-cat="${name}" title="Show only ${name} findings">
        <span class="cat-name">${name}</span>
        <span class="bar" style="--bar-color:${gradeColor(c.score)}"><span data-width="${c.score}"></span></span>
        <span class="cat-score">${c.score}</span>
        <span class="cat-count">${c.findings} issue${c.findings === 1 ? "" : "s"}</span>
      </button>`).join("");

    const change = changeSummary();
    resultsEl.innerHTML = stale + `<div class="report">
      <div class="summary ${change?.gateFlipped ? "celebrate" : ""}" style="--ring-color:${color}">
        <div class="ring" role="img" aria-label="Score ${r.score} out of 100">
          <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/>
            <circle class="value" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="0 100"/></svg>
          <div class="ring-label"><strong>${r.score}</strong><span>/ 100</span></div>
        </div>
        <div class="verdict">
          <div class="grade-line"><span class="grade">Grade ${r.grade}</span><span class="gate ${r.gate.status}">${r.gate.status === "PASS" ? "✓ PASS" : "✕ FAIL"}</span></div>
          ${reasons}
          ${renderDelta()}
          <div class="stats">${plural(s.lines, "line")} · ${plural(s.functions, "function")} · ${plural(s.classes, "class", "classes")} · ${plural(r.findings.length, "finding")}</div>
        </div>
      </div>
      <div class="section-title">Categories</div>
      <div class="cats">${cats}</div>
      ${renderCweSection(r)}
      <div class="section-title" id="findings-title">Findings</div>
      <div id="findings-area"></div>
    </div>`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      resultsEl.querySelector(".ring .value")?.setAttribute("stroke-dasharray", `${r.score} 100`);
      resultsEl.querySelectorAll(".bar > span").forEach(el => { el.style.width = el.dataset.width + "%"; });
    }));
    renderFindings();
  }

  function renderCweSection(r) {
    if (!r.cwe_summary.length) return "";
    const qualityCount = r.cwe_summary.filter(c => c.quality_only).length;
    const rows = r.cwe_summary.map(c => `
      <button class="cwe-row sev-${c.worst_severity} ${filters.cwe === c.id ? "active" : ""}" data-cwe="${c.id}"
              title="${escapeHtml(`${c.id}: ${c.name}`)}">
        <span class="dot"></span>
        <span class="cwe-id">${c.id}</span>
        <span class="cwe-short">${escapeHtml(c.short)}</span>
        <span>${c.quality_only ? `<span class="quality-tag" title="${escapeHtml(QUALITY_HINT)}">quality</span>` : ""}</span>
        <span class="cwe-count">×${c.count}</span>
      </button>`).join("");
    return `
      <div class="section-title">Weaknesses (CWE)</div>
      <p class="cwe-note">${plural(r.cwe_summary.length, "distinct CWE")} across ${r.cwe_coverage.mapped} of
        ${plural(r.cwe_coverage.total, "finding")}${qualityCount ? `; ${qualityCount} tagged <span class="quality-tag">quality</span> are code-quality weaknesses, not vulnerabilities` : ""}. Click one to filter.</p>
      <div class="cwe-list">${rows}</div>`;
  }

  function cweTags(f) {
    if (!f.cwe.length) return "";
    return `<div class="cwe-tags">${f.cwe.map(c => `
      <a class="cwe-pill sev-${f.severity} ${c.quality_only ? "quality" : ""}" href="${escapeHtml(c.url)}" target="_blank"
         rel="noopener" title="${escapeHtml(`${c.id}: ${c.name}`)}"><b>${c.id}</b>${escapeHtml(c.short)}</a>`).join("")}</div>`;
  }

  function renderFindings() {
    const area = $("#findings-area");
    if (!area || !report?.ok) return;
    const inCategory = report.findings.filter(f =>
      (!filters.category || f.category === filters.category) && (!filters.cwe || f.cwe[0]?.id === filters.cwe) &&
      (!filters.fixable || f.fix));
    const fixableCount = report.findings.filter(f =>
      (!filters.category || f.category === filters.category) && (!filters.cwe || f.cwe[0]?.id === filters.cwe) && f.fix).length;
    const counts = Object.fromEntries(SEVERITIES.map(sv => [sv, inCategory.filter(f => f.severity === sv).length]));
    const shown = inCategory.filter(f => !filters.severity || f.severity === filters.severity);

    const active = [filters.cwe && ["cwe", filters.cwe], filters.category && ["category", filters.category]].filter(Boolean);
    const clearChips = active.map(([key, label]) =>
      `<button class="chip active" data-clear="${key}" title="Clear this filter">${escapeHtml(label)} ✕</button>`);
    const chips = clearChips.concat([`<button class="chip ${filters.severity ? "" : "active"}" data-sev="">All <b>${inCategory.length}</b></button>`])
      .concat(SEVERITIES.filter(sv => counts[sv]).map(sv =>
        `<button class="chip sev-${sv} ${filters.severity === sv ? "active" : ""}" data-sev="${sv}">
          <span class="dot"></span>${sv[0].toUpperCase() + sv.slice(1)} <b>${counts[sv]}</b></button>`))
      .concat(fixableCount ? [`<button class="chip ${filters.fixable ? "active" : ""}" data-fixable title="Only findings with an automatic patch">
          🔧 Fixable <b>${fixableCount}</b></button>`] : []).join("");

    let list;
    if (!report.findings.length) {
      list = `<div class="none">No findings. This code meets every rule in the policy.</div>`;
    } else if (!shown.length) {
      list = `<div class="none">No findings match this filter.</div>`;
    } else {
      list = shown.map((f, i) => `
        <article class="finding sev-${f.severity} ${f.line === activeLine ? "is-active" : ""}" data-line="${f.line}">
          <button class="finding-head" data-goto="${f.line}" title="Show line ${f.line} in the editor">
            <span class="sev">${f.severity}</span>
            <span class="finding-title">${escapeHtml(f.title)}<span class="rule-id">${f.rule_id}</span></span>
            ${pointsTag(f)}
            <span class="loc">line ${f.line}</span>
          </button>
          <div class="finding-body">
            <p class="msg">${richText(f.message)}</p>
            <div class="finding-actions">
              ${f.fix ? `<button class="fix-btn" data-fix="${report.findings.indexOf(f)}">🔧 Preview fix</button>`
                      : `<span class="manual">${f.category === "security" ? "No safe auto-patch: needs a human" : "Manual fix"}</span>`}
            </div>
            ${cweTags(f)}
            ${f.snippet ? `<code class="snippet">${escapeHtml(f.snippet)}</code>` : ""}
            <details ${i === 0 && ["critical", "high"].includes(f.severity) ? "open" : ""}>
              <summary>Why it matters &amp; how to fix</summary>
              <p><b>Why:</b> ${richText(f.why)}</p>
              <p><b>Fix:</b> ${richText(f.fix)}</p>
              ${f.cwe.map(c => `<p><b>${c.id}:</b> ${escapeHtml(c.name)}
                ${c.quality_only ? `<span class="quality-tag" title="${escapeHtml(QUALITY_HINT)}">quality</span>` : ""}</p>`).join("")}
              ${f.ref ? `<p>${refLink(f.ref)}</p>` : ""}
            </details>
          </div>
        </article>`).join("");
    }
    area.innerHTML = `<div class="chips">${chips}</div><div class="findings">${list}</div>`;
  }

  function pointsTag(f) {
    const p = f.points;
    if (!p) return "";
    if (!p.counted) return `<span class="pts uncounted" title="Only the first ${perRuleCap} findings of each rule lower the score">not scored</span>`;
    const clamped = p.category_clamped
      ? ` ${f.category[0].toUpperCase() + f.category.slice(1)} is already at 0, so fixing this alone won't move the score yet.` : "";
    return `<span class="pts" title="Costs ${p.category} points in ${f.category}.${clamped}">−${p.category}</span>`;
  }

  function markActiveFindings(line, scroll) {
    let first = null;
    resultsEl.querySelectorAll(".finding").forEach(el => {
      const on = Number(el.dataset.line) === line;
      el.classList.toggle("is-active", on);
      if (on && !first) first = el;
    });
    if (scroll && first) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  resultsEl.addEventListener("click", e => {
    const fixBtn = e.target.closest("[data-fix]");
    if (fixBtn) return previewFix(report.findings[Number(fixBtn.dataset.fix)]);
    if (e.target.closest("[data-fixable]")) {
      filters.fixable = !filters.fixable;
      filters.severity = null;
      return renderFindings();
    }
    const goto = e.target.closest("[data-goto]");
    if (goto) return jumpToLine(Number(goto.dataset.goto));
    const cat = e.target.closest(".cat");
    if (cat) {
      filters.category = filters.category === cat.dataset.cat ? null : cat.dataset.cat;
      filters.severity = null;
      resultsEl.querySelectorAll(".cat").forEach(el => el.classList.toggle("active", el.dataset.cat === filters.category));
      return renderFindings();
    }
    const cweRow = e.target.closest(".cwe-row");
    if (cweRow) {
      filters.cwe = filters.cwe === cweRow.dataset.cwe ? null : cweRow.dataset.cwe;
      filters.severity = null;
      resultsEl.querySelectorAll(".cwe-row").forEach(el => el.classList.toggle("active", el.dataset.cwe === filters.cwe));
      renderFindings();
      if (filters.cwe) $("#findings-title")?.scrollIntoView({ block: "start", behavior: "smooth" });
      return;
    }
    const clear = e.target.closest("[data-clear]");
    if (clear) {
      filters[clear.dataset.clear] = null;
      resultsEl.querySelectorAll(clear.dataset.clear === "cwe" ? ".cwe-row" : ".cat")
        .forEach(el => el.classList.remove("active"));
      return renderFindings();
    }
    const chip = e.target.closest(".chip");
    if (chip) {
      filters.severity = chip.dataset.sev || null;
      renderFindings();
    }
  });

  exportBtn.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "pwn2patch-report.json" });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // ------------------------------------------------------------ patches
  const diffDialog = $("#diff-dialog");
  let pendingPatch = null;   // { code, label } to apply if the user confirms

  function applyEdits(source, edits) {
    const lines = source.split("\n");
    [...edits].sort((a, b) => b.start - a.start || b.end - a.end)
      .forEach(e => lines.splice(e.start - 1, e.end - e.start + 1, ...e.lines));
    return lines.join("\n");
  }

  const diffLine = (cls, sign, no, text) =>
    `<div class="${cls}"><span class="ln-no">${no ?? ""}</span>${sign} ${escapeHtml(text)}</div>`;

  // Render a fix's edits as hunks against the analyzed code, with 2 lines of context.
  function editsToDiff(source, edits) {
    const lines = source.split("\n");
    return [...edits].sort((a, b) => a.start - b.start).map(e => {
      const from = Math.max(1, e.start - 2), to = Math.min(lines.length, Math.max(e.end, e.start - 1) + 2);
      let html = `<div class="hunk">line ${e.start}</div>`;
      for (let n = from; n < e.start; n++) html += diffLine("", " ", n, lines[n - 1]);
      for (let n = e.start; n <= e.end; n++) html += diffLine("del", "−", n, lines[n - 1]);
      for (const text of e.lines) html += diffLine("add", "+", "", text);
      for (let n = Math.max(e.end, e.start - 1) + 1; n <= to; n++) html += diffLine("", " ", n, lines[n - 1]);
      return html;
    }).join("");
  }

  function unifiedToHtml(diff) {
    let oldNo = 0;
    return diff.split("\n").filter(l => l && !l.startsWith("---") && !l.startsWith("+++")).map(l => {
      if (l.startsWith("@@")) { oldNo = Number(/-(\d+)/.exec(l)?.[1] || 1); return `<div class="hunk">line ${oldNo}</div>`; }
      if (l[0] === "+") return diffLine("add", "+", "", l.slice(1));
      if (l[0] === "-") return diffLine("del", "−", oldNo++, l.slice(1));
      return diffLine("", " ", oldNo++, l.slice(1));
    }).join("");
  }

  function previewFix(f) {
    if (!f?.fix || !isFresh()) return toast("The code changed. Re-analyze before patching.");
    pendingPatch = { code: applyEdits(analyzedCode, f.fix.edits), label: f.fix.title };
    $("#diff-title").textContent = f.fix.title;
    $("#diff-body").innerHTML = `
      <p class="score-preview"><span class="sev sev-${f.severity}" style="width:auto">${f.severity}</span>
        ${escapeHtml(f.title)} · line ${f.line}</p>
      ${f.fix.note ? `<p class="fix-note">${richText(f.fix.note)}</p>` : ""}
      <div class="diff">${editsToDiff(analyzedCode, f.fix.edits)}</div>`;
    const gain = f.points?.gain_if_fixed ?? 0;
    $("#diff-meta").textContent = gain > 0 ? `Raises the overall score by about ${gain}`
      : f.points?.category_clamped ? `${f.category[0].toUpperCase() + f.category.slice(1)} is already at 0: fix a few more to see the score move`
      : "Doesn't change the score, but it's still worth fixing";
    diffDialog.showModal();
    $("#apply-diff").focus();
  }

  async function previewPatchAll() {
    if (!isFresh()) return toast("The code changed. Re-analyze before patching.");
    patchAllBtn.disabled = true;
    try {
      const result = await postJson("/api/fix", { code: analyzedCode });
      if (!result.ok) return toast(result.error?.message || "Could not patch this code.");
      if (!result.applied.length) return toast("Nothing left to patch automatically.");
      pendingPatch = { code: result.code, label: `${plural(result.applied.length, "patch", "patches")}` };
      const left = report.findings.length - result.applied.length;
      $("#diff-title").textContent = `Patch all: ${plural(result.applied.length, "fix", "fixes")}`;
      $("#diff-body").innerHTML = `
        <p class="score-preview">Score <b>${result.score_before}</b> → <b style="color:${gradeColor(result.score_after)}">${result.score_after}</b>
          <span class="meta">· fixes are applied one at a time and each result is re-checked</span></p>
        <ul class="applied-list">${[...result.applied.reduce((m, a) => m.set(a.title, (m.get(a.title) || 0) + 1), new Map())]
          .map(([title, n]) => `<li>${richText(title)}${n > 1 ? ` <b>×${n}</b>` : ""}</li>`).join("")}</ul>
        <div class="diff">${unifiedToHtml(result.diff)}</div>`;
      $("#diff-meta").textContent = left > 0 ? "Some findings will still need a human afterwards" : "";
      diffDialog.showModal();
      $("#apply-diff").focus();
    } catch (err) {
      toast(`Patch failed: ${err.message}`);
    } finally {
      patchAllBtn.disabled = false;
    }
  }
  patchAllBtn.addEventListener("click", previewPatchAll);

  async function applyPendingPatch() {
    if (!pendingPatch) return;
    const { code, label } = pendingPatch;
    pendingPatch = null;
    diffDialog.close();
    undoStack.push(codeEl.value);
    undoBtn.hidden = false;
    const scrollTop = codeEl.scrollTop;
    setCode(code, { keepHistory: true });
    codeEl.scrollTop = scrollTop;
    syncScroll();
    const data = await runAnalysis({ quiet: true });
    const c = changeSummary();
    if (data?.ok && c) toast(`Applied ${label} · ${plural(c.fixed, "issue")} fixed · score ${c.from} → ${data.score}` +
                             (c.gateFlipped ? " · gate now PASSES 🎉" : ""));
  }
  $("#apply-diff").addEventListener("click", applyPendingPatch);
  $("#cancel-diff").addEventListener("click", () => diffDialog.close());
  $("#close-diff").addEventListener("click", () => diffDialog.close());
  diffDialog.addEventListener("click", e => { if (e.target === diffDialog) diffDialog.close(); });
  diffDialog.addEventListener("close", () => { pendingPatch = null; });

  undoBtn.addEventListener("click", () => {
    if (!undoStack.length) return;
    setCode(undoStack.pop(), { keepHistory: true });
    undoBtn.hidden = !undoStack.length;
    runAnalysis({ quiet: true });
  });

  // ------------------------------------------------------------ theme
  const savedTheme = storage.get("p2p-theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $("#theme-btn").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    storage.set("p2p-theme", document.documentElement.dataset.theme);
  });

  // ------------------------------------------------------------ samples & files
  document.querySelectorAll("[data-sample]").forEach(btn =>
    btn.addEventListener("click", () => { if (samples[btn.dataset.sample]) setCode(samples[btn.dataset.sample]); }));

  const fileInput = $("#file-input");
  $("#open-btn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (file) setCode(await file.text());
    fileInput.value = "";
  });
  // Drop a .py file anywhere on the editor.
  const editorPanel = $(".editor-panel");
  editorPanel.addEventListener("dragover", e => { e.preventDefault(); });
  editorPanel.addEventListener("drop", async e => {
    const file = e.dataTransfer?.files?.[0];
    if (!file) return;
    e.preventDefault();
    setCode(await file.text());
  });

  // ------------------------------------------------------------ policy dialog
  const dialog = $("#rules-dialog");
  $("#close-rules").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
  $("#rules-btn").addEventListener("click", async () => {
    dialog.showModal();
    try {
      const { policy, rules, cwes } = await (await fetch("/api/policy")).json();
      const mappedRules = rules.filter(r => r.cwe.length).length;
      const cweCell = r => r.cwe.length ? r.cwe.map(id => {
        const c = cwes[id];
        return `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener" title="${escapeHtml(c.name)}">${id}</a>` +
               (c.quality_only ? ` <span class="quality-tag" title="${escapeHtml(QUALITY_HINT)}">quality</span>` : "");
      }).join("<br>") : `<span class="meta" title="No CWE entry describes this accurately">none</span>`;
      $("#policy-title").textContent = policy.name;
      const weights = Object.entries(policy.weights).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join(" · ");
      const limits = policy.limits;
      $("#rules-body").innerHTML = `
        <div class="policy-facts">
          <div class="fact"><b>Gate fails when</b>score &lt; ${policy.gate.min_score}, or any ${policy.gate.fail_on_severity.join(" / ")} finding</div>
          <div class="fact"><b>Category weights</b>${weights}</div>
          <div class="fact"><b>Limits</b>${limits.max_function_lines} lines/function · complexity ${limits.max_complexity} · ${limits.max_params} params · nesting ${limits.max_nesting}</div>
          <div class="fact"><b>Penalty per finding</b>${Object.entries(policy.penalties).map(([k, v]) => `${k} −${v}`).join(" · ")}</div>
          <div class="fact"><b>CWE coverage</b>${mappedRules} of ${rules.length} rules map to a CWE (checked against MITRE CWE 5.0)</div>
        </div>
        <p class="meta">Edit <code>checker/policy.json</code> to change the policy and <code>checker/cwe.py</code> for CWE mappings.</p>
        <table><thead><tr><th>Rule</th><th>Severity</th><th>Category</th><th>Checks for</th><th>CWE</th></tr></thead><tbody>
        ${rules.map(r => `<tr><td><code>${r.id}</code></td><td class="sev-cell sev-${r.severity}">${r.severity}</td>
          <td style="text-transform:capitalize">${r.category}</td><td>${escapeHtml(r.title)}</td><td>${cweCell(r)}</td></tr>`).join("")}
        </tbody></table>`;
    } catch {
      $("#rules-body").textContent = "Could not load the policy. Is the server running?";
    }
  });

  // ------------------------------------------------------------ start
  let perRuleCap = 3;
  fetch("/api/policy").then(r => r.json()).then(d => { perRuleCap = d.policy.max_counted_per_rule ?? 3; }).catch(() => {});
  measureChar();
  document.fonts?.ready.then(() => { measureChar(); renderEditorDecorations(true); });
  renderEmpty();
  renderEditorDecorations();
  fetch("/api/samples").then(r => r.json()).then(data => {
    samples = data;
    if (!codeEl.value && samples.bad_example) {
      setCode(samples.bad_example);
      runAnalysis({ quiet: true });
    }
  }).catch(() => {});
})();
</script>
</body>
</html>
